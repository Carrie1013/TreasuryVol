    <style>
:root {
  --bg: #eae9eb;
  --panel: rgba(255, 255, 255, 0.92);
  --panel-strong: #ffffff;
  --ink: #131225;
  --muted: #797882;
  --line: rgba(19, 18, 37, 0.12);
  --accent: #111057;
  --accent-2: #0dc8dd;
  --accent-3: #6081f5;
  --accent-4: #7318aa;
  --shadow: 0 22px 50px rgba(17, 16, 87, 0.10);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Manrope", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at top left, rgba(7, 235, 247, 0.22), transparent 26%),
    radial-gradient(circle at top right, rgba(96, 129, 245, 0.18), transparent 28%),
    linear-gradient(180deg, #f7f7f9 0%, #eae9eb 100%);
}

.page-shell {
  max-width: 1360px;
  margin: 0 auto;
  padding: 32px 20px 56px;
}

.hero {
  margin-bottom: 22px;
}

h1 {
  margin: 0;
  font-size: clamp(2.3rem, 4vw, 4.3rem);
  line-height: 0.95;
  letter-spacing: -0.04em;
}

.toolbar,
.panel,
.banner {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}

.toolbar {
  border-radius: 24px;
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 18px;
  align-items: end;
  margin-bottom: 12px;
}

.toolbar label,
.toolbar legend {
  font-size: 0.9rem;
  color: var(--muted);
}

input,
select,
button {
  font: inherit;
}

input[type="number"],
select {
  min-width: 120px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-strong);
  padding: 10px 12px;
  margin-top: 6px;
}

.window-picker {
  display: flex;
  gap: 12px;
  align-items: center;
  border: 0;
  padding: 0;
  margin: 0;
}

.window-picker label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  cursor: pointer;
  transition: transform 160ms ease, opacity 160ms ease;
}

button:hover {
  transform: translateY(-1px);
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

.primary-btn {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-3) 100%);
  color: white;
}

.secondary-btn {
  background: white;
  border: 1px solid var(--line);
  color: var(--ink);
}

.accent-btn {
  background: linear-gradient(135deg, var(--accent-2) 0%, #07ebf7 100%);
  color: white;
}

.banner {
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 18px;
  color: var(--accent);
  background: rgba(13, 200, 221, 0.10);
}

.hidden {
  display: none;
}

.panel-grid {
  display: grid;
  gap: 18px;
}

.two-up {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-bottom: 18px;
}

.panel {
  border-radius: 28px;
  padding: 18px;
  margin-bottom: 18px;
}

.embed-panel {
  padding: 10px 10px 12px;
}

.embed-panel .panel-header {
  margin-bottom: 6px;
  padding: 0 4px;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 10px;
}

.panel h2 {
  margin: 0;
  font-size: 1.15rem;
}

.chart {
  min-height: 360px;
}

.chart.tall {
  min-height: 460px;
}

.embed-frame {
  width: 100%;
  height: 760px;
  border: 0;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.7);
}

.table-wrap {
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(255, 255, 255, 0.55);
  border-radius: 18px;
  overflow: hidden;
}

th,
td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
  font-size: 0.92rem;
}

th {
  background: rgba(17, 16, 87, 0.08);
}

@media (max-width: 980px) {
  .hero,
  .two-up {
    grid-template-columns: 1fr;
  }

  .panel-header {
    align-items: flex-start;
    flex-direction: column;
  }
}

    <script>
window.STATIC_DASHBOARD_CONFIG = {
  "annualization_days": 252,
  "windows": {
    "1M": 21,

  },
  "percentile_lookback_years": 20,

  },

  ],

    <script>
const TENOR_ORDER = ["1M", "1.5M", "2M", "3M", "4M", "6M", "1Y", "2Y", "3Y", "5Y", "7Y", "10Y", "20Y", "30Y"];
const CURVE_TENORS = ["1M", "3M", "6M", "1Y", "2Y", "3Y", "5Y", "10Y", "20Y", "30Y"];
const HIGH_RATE_PERIOD_LABEL = "High Rate Period";
const LOW_RATE_PERIOD_LABEL = "Low Rate Period";
const LAST_20_YEARS_LABEL = "Last 20 Years";
const LAST_10_YEARS_LABEL = "Last 10 Years";

const state = {
  config: null,
  yields: [],
  payload: null,
  sourceLabel: "Official Treasury XML feed",
};

const embeddedConfig = window.STATIC_DASHBOARD_CONFIG || null;

const dom = {
  startYear: document.getElementById("start-year"),
  fetchBtn: document.getElementById("fetch-btn"),
  downloadBtn: document.getElementById("download-btn"),
  exportExcelBtn: document.getElementById("export-excel-btn"),
  volWindowSelect: document.getElementById("vol-window-select"),
  ratesRangeSelect: document.getElementById("rates-range-select"),
  messageBanner: document.getElementById("message-banner"),
  regimeTable: document.getElementById("regime-table"),
  latestObservationsTable: document.getElementById("latest-observations-table"),
};

function selectedWindows() {
  return [...document.querySelectorAll('input[name="window"]:checked')].map((el) => el.value);
}

function showMessage(message) {
  if (!message) {
    dom.messageBanner.classList.add("hidden");
    dom.messageBanner.textContent = "";
    return;
  }
  dom.messageBanner.classList.remove("hidden");
  dom.messageBanner.textContent = message;
}

function setBusy(isBusy) {
  dom.fetchBtn.disabled = isBusy;
  dom.downloadBtn.disabled = isBusy || !state.yields.length;
  dom.exportExcelBtn.disabled = isBusy || !state.payload;
  dom.fetchBtn.textContent = isBusy ? "Fetching..." : "Refresh from Treasury";
}

function normalizeRow(row) {
  if (!row.Date) return null;
  const normalized = { Date: row.Date };
  TENOR_ORDER.forEach((tenor) => {
    const raw = row[tenor];
    normalized[tenor] = raw === undefined || raw === null || raw === "" ? null : Number(raw);
  });
  return normalized;
}

function yieldsToCsv(rows) {
  const columns = ["Date", ...TENOR_ORDER.filter((tenor) => rows.some((row) => row[tenor] !== null && row[tenor] !== undefined))];
  const csvRows = [
    columns.join(","),
    ...rows.map((row) => columns.map((col) => row[col] ?? "").join(",")),
  ];
  return csvRows.join("\n");
}

function downloadCurrentCsv() {
  const csv = yieldsToCsv(state.yields);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "treasury_yields_official.csv";
  link.click();
  URL.revokeObjectURL(url);
}

function rootMeanSquare(values) {
  if (!values.length) return null;
  return Math.sqrt(values.reduce((sum, value) => sum + (value ** 2), 0) / values.length);
}

function quantile(sortedValues, q) {
  if (!sortedValues.length) return null;
  if (sortedValues.length === 1) return sortedValues[0];
  const pos = (sortedValues.length - 1) * q;
  const base = Math.floor(pos);
  const rest = pos - base;
  const lower = sortedValues[base];
  const upper = sortedValues[base + 1] ?? lower;
  return lower + rest * (upper - lower);
}

function availableTenors(rows) {
  return TENOR_ORDER.filter((tenor) => rows.some((row) => row[tenor] !== null && row[tenor] !== undefined));
}

function filterByStartYear(rows, startYear) {
  return rows.filter((row) => Number(row.Date.slice(0, 4)) >= startYear);
}

function calculateBpChanges(rows, tenors) {
  return rows.map((row, index) => {
    const out = { Date: row.Date };
    tenors.forEach((tenor) => {
      if (index === 0 || rows[index - 1][tenor] === null || row[tenor] === null) {
        out[tenor] = null;
      } else {
        out[tenor] = (row[tenor] - rows[index - 1][tenor]) * 100.0;
      }
    });
    return out;
  });
}

function annualizedRmsBpVol(values, annualizationDays) {
  const valid = values.filter((value) => value !== null && value !== undefined);
  const dailyRmsBp = rootMeanSquare(valid);
  return dailyRmsBp === null ? null : dailyRmsBp * Math.sqrt(annualizationDays);
}

function rollingAnnualizedBpVol(rows, windows, annualizationDays, tenors) {
  const bp = calculateBpChanges(rows, tenors);
  const result = {};
  Object.entries(windows).forEach(([label, nDays]) => {
    const minPeriods = Math.max(5, Math.floor(nDays * 0.8));
    result[label] = bp.map((row, index) => {
      const out = { Date: row.Date };
      tenors.forEach((tenor) => {
        const windowRows = bp.slice(Math.max(0, index - nDays + 1), index + 1).map((item) => item[tenor]).filter((value) => value !== null);
        if (windowRows.length < minPeriods) {
          out[tenor] = null;
        } else {
          out[tenor] = annualizedRmsBpVol(windowRows, annualizationDays);
        }
      });
      return out;
    });
  });
  return { bp, result };
}

function currentCurve(volByWindow, tenors) {
  const rows = [];
  Object.entries(volByWindow).forEach(([label, series]) => {
    const valid = [...series].reverse().find((row) => tenors.some((tenor) => row[tenor] !== null));
    if (!valid) return;
    tenors.forEach((tenor) => {
      rows.push({
        Window: label,
        Tenor: tenor,
        "Annualized BP Vol": valid[tenor],
        "As of": valid.Date,
      });
    });
  });
  return rows;
}

function historicalPercentileReferences(volRows, lookbackYears, tenors) {
  const end = new Date(volRows[volRows.length - 1].Date);
  const start = new Date(end);
  start.setFullYear(start.getFullYear() - lookbackYears);
  return tenors.map((tenor) => {
    const series = volRows
      .filter((row) => new Date(row.Date) >= start && row[tenor] !== null)
      .map((row) => row[tenor])
      .sort((a, b) => a - b);
    if (!series.length) return null;
    return {
      Tenor: tenor,
      P20: quantile(series, 0.20),
      P50: quantile(series, 0.50),
      P80: quantile(series, 0.80),
      P95: quantile(series, 0.95),
    };
  }).filter(Boolean);
}

function currentPercentiles(volRows, lookbackYears, tenors, thresholds) {
  const end = new Date(volRows[volRows.length - 1].Date);
  const start = new Date(end);
  start.setFullYear(start.getFullYear() - lookbackYears);
  const last = [...volRows].reverse().find((row) => tenors.some((tenor) => row[tenor] !== null));
  return tenors.map((tenor) => {
    const hist = volRows
      .filter((row) => new Date(row.Date) >= start && row[tenor] !== null)
      .map((row) => row[tenor]);
    const current = last?.[tenor] ?? null;
    let percentile = null;
    if (hist.length && current !== null) {
      percentile = 100 * (hist.filter((value) => value <= current).length / hist.length);
    }
    return {
      Tenor: tenor,
      "Current BP Vol": current,
      "Historical Percentile": percentile,
      "As of": last?.Date ?? null,
      Regime: labelRegime(percentile, thresholds),
    };
  });
}

function labelRegime(percentile, thresholds) {
  if (percentile === null || Number.isNaN(percentile)) return "Insufficient data";
  if (percentile >= thresholds.extreme) return "Extreme";
  if (percentile >= thresholds.high) return "High";
  if (percentile <= thresholds.low) return "Low";
  return "Normal";
}

function fixedRegimeReferences(bpRows, regimes, annualizationDays, tenors) {
  const rows = [];
  Object.entries(regimes).forEach(([name, [start, end]]) => {
    const sample = bpRows.filter((row) => row.Date >= start && row.Date <= end);
    tenors.forEach((tenor) => {
      const values = sample.map((row) => row[tenor]).filter((value) => value !== null);
      rows.push({
        Regime: name,
        Tenor: tenor,
        "Annualized BP Vol": annualizedRmsBpVol(values, annualizationDays),
        "Daily RMS BP": rootMeanSquare(values),
        Start: start,
        End: end,
        Observations: values.length,
      });
    });
  });
  return rows;
}

function latestCompletedYear(latestDateText) {
  if (!latestDateText) return new Date().getFullYear() - 1;
  const latest = new Date(latestDateText);
  const year = latest.getFullYear();
  const isYearComplete = latest.getMonth() === 11 && latest.getDate() === 31;
  return isYearComplete ? year : year - 1;
}

function buildFixedRegimes(latestDateText) {
  const endYear = latestCompletedYear(latestDateText);
  const last20Start = endYear - 19;
  const last10Start = endYear - 9;
  return {
    [LAST_20_YEARS_LABEL]: [`${last20Start}-01-01`, `${endYear}-12-31`],
    [LOW_RATE_PERIOD_LABEL]: ["2012-01-01", "2021-12-31"],
    [HIGH_RATE_PERIOD_LABEL]: ["2022-01-01", "2023-12-31"],
    [LAST_10_YEARS_LABEL]: [`${last10Start}-01-01`, `${endYear}-12-31`],
  };
}

function referenceLegendOrder(latestDateText) {
  return [
    LAST_20_YEARS_LABEL,
    LOW_RATE_PERIOD_LABEL,
    HIGH_RATE_PERIOD_LABEL,
    LAST_10_YEARS_LABEL,
    "Last 3 Years",
    "Last Quarter",
    "1Y",
    "3M",
    "1M",
  ];
}

function trailingReferenceRows(bpRows, windows, annualizationDays, tenors) {
  return Object.entries(windows).flatMap(([label, nDays]) => {
    const sample = bpRows.slice(-nDays);
    return tenors.map((tenor) => {
      const values = sample.map((row) => row[tenor]).filter((value) => value !== null);
      return {
        Regime: label,
        Tenor: tenor,
        "Annualized BP Vol": annualizedRmsBpVol(values, annualizationDays),
        "Daily RMS BP": rootMeanSquare(values),
        Start: sample[0]?.Date ?? null,
        End: sample[sample.length - 1]?.Date ?? null,
        Observations: values.length,
      };
    });
  });
}

function filterReferenceTenors(tenors, config) {
  const preferred = config.excel_reference_tenors || tenors;
  return preferred.filter((tenor) => tenors.includes(tenor));
}

function pivotReferenceRows(rows, tenors) {
  const order = [...new Set(rows.map((row) => row.Regime))];
  return order.map((regime) => {
    const out = { Regime: regime };
    tenors.forEach((tenor) => {
      const match = rows.find((row) => row.Regime === regime && row.Tenor === tenor);
      out[tenor] = match?.["Annualized BP Vol"] ?? null;
    });
    return out;
  });
}

function buildVolIncreaseRows(referenceRows, tenors, currentLabel, baseLabels) {
  return baseLabels.flatMap((baseLabel) => tenors.map((tenor) => {
    const current = referenceRows.find((row) => row.Regime === currentLabel && row.Tenor === tenor)?.["Annualized BP Vol"] ?? null;
    const base = referenceRows.find((row) => row.Regime === baseLabel && row.Tenor === tenor)?.["Annualized BP Vol"] ?? null;
    return {
      Comparison: `${currentLabel} vs ${baseLabel}`,
      Tenor: tenor,
      "Current Annualized BP Vol": current,
      "Reference Annualized BP Vol": base,
      "Increase %": current !== null && base ? (current / base - 1) * 100 : null,
    };
  }));
}

function qualityReport(yields, bpChanges, threshold, tenors) {
  const latest = yields[yields.length - 1]?.Date;
  const latestDate = latest ? new Date(latest) : null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const latestAge = latestDate ? Math.floor((today - latestDate) / 86400000) : null;
  const duplicates = yields.length - new Set(yields.map((row) => row.Date)).size;
  const missing = yields.reduce((sum, row) => sum + tenors.filter((tenor) => row[tenor] === null).length, 0);
  const outliers = bpChanges.reduce((sum, row) => sum + tenors.filter((tenor) => row[tenor] !== null && Math.abs(row[tenor]) > threshold).length, 0);
  return [
    { Check: "Rows", Value: String(yields.length), Status: "OK" },
    { Check: "Date range", Value: `${yields[0]?.Date ?? "-"} to ${latest ?? "-"}`, Status: "OK" },
    { Check: "Duplicate dates", Value: String(duplicates), Status: duplicates === 0 ? "OK" : "Warning" },
    { Check: "Missing yield observations", Value: String(missing), Status: missing === 0 ? "OK" : "Review" },
    { Check: `|Daily move| > ${threshold} bp`, Value: String(outliers), Status: outliers === 0 ? "OK" : "Review" },
    { Check: "Calendar days since latest observation", Value: latestAge === null ? "-" : String(latestAge), Status: latestAge !== null && latestAge <= 5 ? "OK" : "Stale" },
  ];
}

function buildPayload(rows) {
  const startYear = Number(dom.startYear.value) || 2005;
  const filteredRows = filterByStartYear(rows, startYear);
  const latestDate = filteredRows[filteredRows.length - 1]?.Date ?? "-";
  const tenors = availableTenors(filteredRows);
  const windows = Object.fromEntries(Object.entries(state.config.windows).filter(([key]) => selectedWindows().includes(key)));
  const activeWindows = Object.keys(windows).length ? windows : state.config.windows;
  const { bp, result: volByWindow } = rollingAnnualizedBpVol(filteredRows, activeWindows, state.config.annualization_days, tenors);
  const primaryWindow = volByWindow["3M"] ? "3M" : Object.keys(volByWindow)[0];
  const referenceTenors = filterReferenceTenors(tenors, state.config);
  const currentCurveRows = currentCurve(volByWindow, tenors);
  const percentileRefs = historicalPercentileReferences(volByWindow[primaryWindow], state.config.percentile_lookback_years, tenors);
  const currentPercentileRows = currentPercentiles(volByWindow[primaryWindow], state.config.percentile_lookback_years, tenors, state.config.percentile_thresholds);
  const fixedRegimes = buildFixedRegimes(latestDate);
  const fixedRegimeRows = fixedRegimeReferences(bp, fixedRegimes, state.config.annualization_days, referenceTenors);
  const trailingReferenceRowsData = trailingReferenceRows(bp, {
    "Last 3 Years": state.config.annualization_days * 3,
    "Last Quarter": state.config.windows["3M"],
    "1Y": state.config.windows["1Y"],
    "3M": state.config.windows["3M"],
    "1M": state.config.windows["1M"],
  }, state.config.annualization_days, referenceTenors);
  const legendOrder = referenceLegendOrder(latestDate);
  const excelReferenceRows = [...fixedRegimeRows, ...trailingReferenceRowsData]
    .sort((a, b) => legendOrder.indexOf(a.Regime) - legendOrder.indexOf(b.Regime));
  const excelReferenceTableRows = pivotReferenceRows(excelReferenceRows, referenceTenors);
  const volIncreaseRows = buildVolIncreaseRows(excelReferenceRows, referenceTenors, "3M", [LOW_RATE_PERIOD_LABEL, LAST_20_YEARS_LABEL, LAST_10_YEARS_LABEL, "Last 3 Years"]);
  const qualityRows = qualityReport(filteredRows, bp, state.config.outlier_bp_threshold, tenors);

  return {
    summary: {
      latest_date: latestDate,
      source: state.sourceLabel,
      rows: filteredRows.length,
      tenors: tenors.length,
      high_or_extreme_tenors: currentPercentileRows.filter((row) => ["High", "Extreme"].includes(row.Regime)).length,
      selected_windows: Object.keys(activeWindows),
      primary_window: primaryWindow,
      volatility_method: "Excel RMS realized volatility, annualized in basis points",
    },
    bp_changes: bp,
    yields: filteredRows,
    vol_history: volByWindow,
    current_curve: currentCurveRows,
    percentile_refs: percentileRefs,
    current_percentiles: currentPercentileRows,
    fixed_regimes: fixedRegimeRows,
    excel_references: excelReferenceRows,
    excel_reference_table: excelReferenceTableRows,
    vol_increase: volIncreaseRows,
    quality: qualityRows,
    latest_observations: [...filteredRows].reverse().slice(0, 20),
  };
}

function formatValue(value, digits = 1) {
  if (value === null || value === undefined || value === "") return "-";
  const num = Number(value);
  if (Number.isNaN(num)) return value;
  return num.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function renderTable(container, rows, numericDigits = 1) {
  if (!rows?.length) {
    container.innerHTML = "<p>No data available.</p>";
    return;
  }
  const columns = Object.keys(rows[0]);
  const head = columns.map((col) => `<th>${col}</th>`).join("");
  const body = rows.map((row) => {
    const cells = columns.map((col) => {
      const value = row[col];
      return `<td>${typeof value === "number" ? formatValue(value, numericDigits) : (value ?? "")}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  container.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function rowsForSheet(rows) {
  return rows.map((row) => Object.fromEntries(Object.entries(row).map(([key, value]) => [key, value ?? ""])));
}

function addWorksheet(workbook, name, rows) {
  const safeName = name.slice(0, 31);
  const data = rowsForSheet(rows);
  const sheet = XLSX.utils.json_to_sheet(data.length ? data : [{ Note: "No data available" }]);
  const headers = Object.keys(data[0] || { Note: "" });
  sheet["!cols"] = headers.map((header) => ({ wch: Math.min(Math.max(header.length + 2, 12), 28) }));
  XLSX.utils.book_append_sheet(workbook, sheet, safeName);
}

function exportExcelReport() {
  if (!state.payload) {
    showMessage("Load Treasury data before exporting the Excel report.");
    return;
  }
  if (!window.XLSX) {
    showMessage("Excel export library is not available. Check the CDN connection and try again.");
    return;
  }

  const workbook = XLSX.utils.book_new();
  const summaryRows = [
    { Metric: "Latest date", Value: state.payload.summary.latest_date },
    { Metric: "Source", Value: state.payload.summary.source },
    { Metric: "Observations", Value: state.payload.summary.rows },
    { Metric: "Tenors", Value: state.payload.summary.tenors },
    { Metric: "Primary window", Value: state.payload.summary.primary_window },
    { Metric: "Volatility method", Value: state.payload.summary.volatility_method },
    { Metric: "Annualization days", Value: state.config.annualization_days },
    { Metric: "Windows", Value: state.payload.summary.selected_windows.join(", ") },
  ];
  const methodologyRows = [
    { Item: "Daily move", Method: "Current yield minus prior observation yield, multiplied by 100 to convert percentage points to basis points." },
    { Item: "Excel RMS daily vol", Method: "SQRT(SUMSQ(daily bp moves) / COUNT(daily bp moves)). This matches the workbook's realized-volatility style formula." },
    { Item: "Annualized BP Vol", Method: "Excel RMS daily vol * SQRT(252)." },
    { Item: "Percentile comparison", Method: "Current annualized RMS bp vol ranked against the selected historical lookback." },
  ];

  addWorksheet(workbook, "Summary", summaryRows);
  addWorksheet(workbook, "Current Curve", state.payload.current_curve);
  addWorksheet(workbook, "Percentiles", state.payload.current_percentiles.map((row) => ({
    ...row,
    ...(state.payload.percentile_refs.find((item) => item.Tenor === row.Tenor) || {}),
  })));
  addWorksheet(workbook, "Fixed Regimes", state.payload.fixed_regimes);
  addWorksheet(workbook, "Latest Observations", state.payload.latest_observations);
  addWorksheet(workbook, "Yield History", state.payload.yields);
  addWorksheet(workbook, "Daily BP Changes", state.payload.bp_changes);
  addWorksheet(workbook, "Methodology", methodologyRows);

  XLSX.writeFile(workbook, `treasury_vol_report_${state.payload.summary.latest_date}.xlsx`);
}

function populateVolWindowSelect(summary) {
  dom.volWindowSelect.innerHTML = summary.selected_windows
    .map((window) => `<option value="${window}" ${window === summary.primary_window ? "selected" : ""}>${window}</option>`)
    .join("");
}

function plotCurrentCurve(rows) {
  const grouped = {};
  rows.filter((row) => CURVE_TENORS.includes(row.Tenor)).forEach((row) => {
    if (!grouped[row.Window]) grouped[row.Window] = [];
    grouped[row.Window].push(row);
  });
  const traces = Object.entries(grouped).map(([window, items]) => {
    const orderedItems = [...items].sort((a, b) => CURVE_TENORS.indexOf(a.Tenor) - CURVE_TENORS.indexOf(b.Tenor));
    return {
      x: orderedItems.map((item) => item.Tenor),
      y: orderedItems.map((item) => item["Annualized BP Vol"]),
      hovertemplate: "%{x}<br>%{y:.1f} bp<extra>%{fullData.name}</extra>",
      mode: "lines+markers",
      line: { shape: "spline", smoothing: 0.4 },
      name: window,
    };
  });
  Plotly.newPlot("curve-chart", traces, {
    ...baseLayout("Annualized RMS BP Vol (bp)", "Tenor"),
    margin: { t: 20, r: 20, l: 40, b: 68 },
    yaxis: {
      title: { text: "Annualized RMS BP Vol (bp)", standoff: 4 },
      automargin: true,
    },
    xaxis: {
      title: "Tenor",
      type: "category",
      categoryorder: "array",
      categoryarray: CURVE_TENORS,
      tickangle: -20,
      automargin: true,
    },
  }, { responsive: true });
}

function plotPercentileChart(currentRows, refs) {
  const refMap = Object.fromEntries(refs.map((row) => [row.Tenor, row]));
  const tenors = currentRows.map((row) => row.Tenor);
  const traces = [{
    type: "bar",
    x: tenors,
    y: currentRows.map((row) => row["Current BP Vol"]),
    name: "Current",
    marker: { color: "#114b5f" },
  }];
  ["P20", "P50", "P80", "P95"].forEach((field) => {
    traces.push({
      type: "scatter",
      mode: "lines+markers",
      line: { shape: "spline", smoothing: 0.4 },
      name: field,
      x: tenors,
      y: tenors.map((tenor) => refMap[tenor]?.[field] ?? null),
    });
  });
  Plotly.newPlot("percentile-chart", traces, {
    ...baseLayout("Annualized RMS BP Vol (bp)", "Tenor"),
    xaxis: {
      ...baseLayout("Annualized RMS BP Vol (bp)", "Tenor").xaxis,
      title: "",
    },
    barmode: "group",
  }, { responsive: true });
}

function plotFixedRegimes(rows) {
  const grouped = {};
  rows.forEach((row) => {
    if (!grouped[row.Regime]) grouped[row.Regime] = [];
    grouped[row.Regime].push(row);
  });
  const traces = referenceLegendOrder(state.payload.summary.latest_date)
    .filter((name) => grouped[name]?.length)
    .map((name) => ({
      x: grouped[name].map((item) => item.Tenor),
      y: grouped[name].map((item) => item["Annualized BP Vol"]),
      mode: "lines+markers",
      line: { shape: "spline", smoothing: 0.4 },
      name,
    }));
  Plotly.newPlot("fixed-regime-chart", traces, {
    ...baseLayout("Annualized RMS BP Vol (bp)", "Tenor"),
    xaxis: {
      ...baseLayout("Annualized RMS BP Vol (bp)", "Tenor").xaxis,
      title: "",
    },
  }, { responsive: true });
}

function plotVolHistory() {
  const selectedWindow = dom.volWindowSelect.value || state.payload.summary.primary_window;
  const rows = state.payload.vol_history[selectedWindow] || [];
  const tenors = Object.keys(rows[0] || {}).filter((key) => key !== "Date");
  const traces = tenors.map((tenor) => ({
    x: rows.map((row) => row.Date),
    y: rows.map((row) => row[tenor]),
    mode: "lines",
    line: { shape: "spline", smoothing: 0.4 },
    name: tenor,
  }));
  Plotly.newPlot("vol-history-chart", traces, {
    ...baseLayout("Annualized RMS BP Vol (bp)", "Date"),
    xaxis: {
      ...baseLayout("Annualized RMS BP Vol (bp)", "Date").xaxis,
      title: "",
    },
  }, { responsive: true });
}

function filterRatesRange(rows, range) {
  if (!rows.length || range === "All") return rows;
  const end = new Date(rows[rows.length - 1].Date);
  let start = new Date(end);
  if (range === "1M") start.setMonth(start.getMonth() - 1);
  else if (range === "3M") start.setMonth(start.getMonth() - 3);
  else if (range === "6M") start.setMonth(start.getMonth() - 6);
  else if (range === "YTD") start = new Date(end.getFullYear(), 0, 1);
  else if (range === "1Y") start.setFullYear(start.getFullYear() - 1);
  else if (range === "3Y") start.setFullYear(start.getFullYear() - 3);
  else if (range === "5Y") start.setFullYear(start.getFullYear() - 5);
  return rows.filter((row) => new Date(row.Date) >= start);
}

function plotRatesHistory() {
  const rows = filterRatesRange(state.payload.yields, dom.ratesRangeSelect.value);
  const tenors = availableTenors(rows);
  const traces = tenors.map((tenor) => ({
    x: rows.map((row) => row.Date),
    y: rows.map((row) => row[tenor]),
    mode: "lines",
    line: { shape: "spline", smoothing: 0.4 },
    name: tenor,
  }));
  Plotly.newPlot("rates-history-chart", traces, {
    ...baseLayout("Yield (%)", "Date"),
    xaxis: {
      ...baseLayout("Yield (%)", "Date").xaxis,
      title: "",
    },
  }, { responsive: true });
}

function baseLayout(yTitle, xTitle) {
  return {
    ...chromeLayout(),
    yaxis: { title: yTitle },
    xaxis: { title: xTitle },
    legend: { orientation: "h" },
    margin: { t: 20, r: 20, l: 58, b: 52 },
  };
}

function chromeLayout() {
  return {
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(255,255,255,0.3)",
  };
}

function renderPayload() {
  state.payload = buildPayload(state.yields);
  populateVolWindowSelect(state.payload.summary);
  plotCurrentCurve(state.payload.current_curve);
  plotPercentileChart(state.payload.current_percentiles, state.payload.percentile_refs);
  plotFixedRegimes(state.payload.excel_references);
  plotVolHistory();
  plotRatesHistory();

  const regimeRows = state.payload.current_percentiles.map((row) => ({
    ...row,
    ...(state.payload.percentile_refs.find((item) => item.Tenor === row.Tenor) || {}),
  }));

  renderTable(dom.regimeTable, regimeRows);
  renderTable(dom.latestObservationsTable, state.payload.latest_observations, 2);
  dom.exportExcelBtn.disabled = false;
}

async function loadConfig() {
  if (embeddedConfig) {
    state.config = embeddedConfig;
    return;
  }
  const response = await fetch("./config.json");
  state.config = await response.json();
}

function parseTreasuryXml(content) {
  const doc = new DOMParser().parseFromString(content, "application/xml");
  const entries = [...doc.getElementsByTagNameNS("*", "entry")];
  if (!entries.length) {
    throw new Error("No Treasury entries were found in the XML response.");
  }
  const rows = entries.map((entry) => {
    const row = {};
    [...entry.getElementsByTagNameNS("*", "*")].forEach((node) => {
      const tag = node.localName;
      const text = node.textContent?.trim();
      if (text) row[tag] = text;
    });
    const dateText = row.NEW_DATE || row.RECORD_DATE || row.DATE || row.new_date || row.record_date || row.date;
    if (!dateText) return null;
    return normalizeRow({
      Date: dateText.slice(0, 10),
      "1M": row.BC_1MONTH,
      "1.5M": row.BC_1_5MONTH,
      "2M": row.BC_2MONTH,
      "3M": row.BC_3MONTH,
      "4M": row.BC_4MONTH,
      "6M": row.BC_6MONTH,
      "1Y": row.BC_1YEAR,
      "2Y": row.BC_2YEAR,
      "3Y": row.BC_3YEAR,
      "5Y": row.BC_5YEAR,
      "7Y": row.BC_7YEAR,
      "10Y": row.BC_10YEAR,
      "20Y": row.BC_20YEAR,
      "30Y": row.BC_30YEAR,
    });
  }).filter(Boolean);
  return rows.sort((a, b) => a.Date.localeCompare(b.Date));
}

async function fetchTreasuryHistory() {
  const startYear = Number(dom.startYear.value) || 2005;
  const currentYear = new Date().getFullYear();
  const frames = [];
  const failures = [];

  for (let year = startYear; year <= currentYear; year += 1) {
    const url = new URL("https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml");
    url.searchParams.set("data", "daily_treasury_yield_curve");
    url.searchParams.set("field_tdr_date_value", String(year));
    try {
      const response = await fetch(url.toString());
      if (!response.ok) throw new Error(`status ${response.status}`);
      frames.push(...parseTreasuryXml(await response.text()));
    } catch (error) {
      failures.push(`${year}: ${error.message}`);
    }
  }

  if (!frames.length) {
    throw new Error(`All yearly fetches failed. This is usually a browser CORS restriction on a pure static page. ${failures.join(" | ")}`);
  }

  const deduped = [];
  const seen = new Set();
  [...frames].reverse().forEach((row) => {
    if (!seen.has(row.Date)) {
      deduped.push(row);
      seen.add(row.Date);
    }
  });
  deduped.reverse();
  return { rows: deduped, failures };
}

async function refreshFromTreasury() {
  setBusy(true);
  showMessage("");
  try {
    const { rows, failures } = await fetchTreasuryHistory();
    state.yields = rows;
    state.sourceLabel = "Official Treasury XML feed";
    renderPayload();
    if (failures.length) {
      showMessage(`Refresh completed with partial yearly failures: ${failures.join(" | ")}`);
    } else {
      showMessage("Refresh completed. Download current CSV if you want to save the updated snapshot.");
    }
  } catch (error) {
    showMessage(`Treasury refresh failed. ${error.message}`);
  } finally {
    setBusy(false);
  }
}

dom.fetchBtn.addEventListener("click", refreshFromTreasury);
dom.downloadBtn.addEventListener("click", downloadCurrentCsv);
dom.exportExcelBtn.addEventListener("click", exportExcelReport);
dom.volWindowSelect.addEventListener("change", plotVolHistory);
dom.ratesRangeSelect.addEventListener("change", plotRatesHistory);
document.querySelectorAll('input[name="window"]').forEach((checkbox) => {
  checkbox.addEventListener("change", () => {
    if (state.yields.length) renderPayload();
  });
});
dom.startYear.addEventListener("change", () => {
  if (state.yields.length) renderPayload();
});

async function init() {
  try {
    await loadConfig();
    await refreshFromTreasury();
  } catch (error) {
    showMessage(`Initialization failed: ${error.message}`);
    setBusy(false);
  }
}

init();
